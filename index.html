<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#A3254A">
  <title>AuraBlend | Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="logo">AuraBlend</div>
    <a class="pill" href="machine.html"><span class="dot"></span>Machine online</a>
  </header>

  <main class="stack stack--lg">
    <section class="hero" aria-labelledby="hero-title">
      <p class="eyebrow">Your shade. Your style.</p>
      <h1 id="hero-title">Design a lipstick that is yours</h1>
      <a class="btn btn--primary" href="create.html">Create a shade</a>
      <div class="lipstick" aria-hidden="true"><div class="lipstick__bullet"></div><div class="lipstick__collar"></div><div class="lipstick__tube"></div></div>
    </section>

    <section class="stack" aria-labelledby="recent-title" id="recent">
      <div class="section-head">
        <h2 class="h2" id="recent-title">Recent shades</h2>
        <a class="link" href="collection.html">See all</a>
      </div>
      <div class="swatch-row">
        <div class="swatch"><div class="swatch__dot" style="--c:#C7566B"></div><span class="swatch__name">Rose Dream</span></div>
        <div class="swatch"><div class="swatch__dot" style="--c:#D4957F"></div><span class="swatch__name">Nude Bliss</span></div>
        <div class="swatch"><div class="swatch__dot" style="--c:#A23A62"></div><span class="swatch__name">Berry Kiss</span></div>
        <div class="swatch"><div class="swatch__dot" style="--c:#F2735C"></div><span class="swatch__name">Sunset Coral</span></div>
      </div>
    </section>

    <section class="stack" aria-labelledby="pick-title">
      <h2 class="h2" id="pick-title">Today's pick for you</h2>
      <a class="card pick" href="ideas.html">
        <div class="pick__color" style="--c:#C7566B"></div>
        <div class="pick__body">
          <div class="pick__name">Rose Dream</div>
          <div class="muted small">Warm rose, everyday, matte</div>
        </div>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </a>
    </section>
  </main>
  <nav class="tabbar" aria-label="Main">
    <a class="tab" href="index.html" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a class="tab" href="create.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Create</a>
    <a class="tab" href="ideas.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17v4M17 19h4"/></svg>Ideas</a>
    <a class="tab" href="collection.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Saved</a>
    <a class="tab" href="machine.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>Machine</a>
  </nav>
</div>
<script src="script.js" defer></script>
</body>
</html>
