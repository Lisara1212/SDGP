<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#A3254A">
  <title>AuraBlend | Create shade</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="topbar topbar--column">
    <h1 class="title">Create shade</h1>
    <div class="segmented" role="tablist" aria-label="Creation mode">
      <span class="is-active" aria-current="true">Manual</span>
      <a href="ideas.html">AI suggestion</a>
    </div>
  </header>

  <main class="stack" data-creator style="--shade:#B42D46">
    <section class="preview" aria-label="Shade preview">
      <div class="lipstick lipstick--sm" aria-hidden="true"><div class="lipstick__bullet"></div><div class="lipstick__collar"></div><div class="lipstick__tube"></div></div>
      <div>
        <div class="eyebrow" style="color:var(--muted)">Your shade</div>
        <div class="preview__hex" id="hex-out">#B42D46</div>
        <div class="muted small" id="rgb-out">RGB 180, 45, 70 &middot; Matte</div>
        <div class="preview__bar"></div>
      </div>
    </section>

    <section class="stack--sm stack" aria-label="Colour sliders" style="gap:2px">
      <div class="slider"><div class="slider__row"><label for="red">Red</label><span id="red-out">180</span></div><input id="red" type="range" min="0" max="255" value="180"></div>
      <div class="slider"><div class="slider__row"><label for="green">Green</label><span id="green-out">45</span></div><input id="green" type="range" min="0" max="255" value="45"></div>
      <div class="slider"><div class="slider__row"><label for="blue">Blue</label><span id="blue-out">70</span></div><input id="blue" type="range" min="0" max="255" value="70"></div>
    </section>

    <section class="stack--sm stack" aria-labelledby="finish-label">
      <div id="finish-label" style="font-size:14px;font-weight:700">Finish</div>
      <div class="chips chips--equal">
        <button class="chip" type="button" data-finish="Matte" aria-pressed="true">Matte</button>
        <button class="chip" type="button" data-finish="Satin" aria-pressed="false">Satin</button>
        <button class="chip" type="button" data-finish="Gloss" aria-pressed="false">Gloss</button>
      </div>
    </section>

    <div class="field">
      <label class="field__label" for="shade-name">Name</label>
      <input class="input" id="shade-name" type="text" placeholder="Name your shade" maxlength="40">
    </div>

    <section class="stack--sm stack" style="gap:10px">
      <button class="btn btn--primary btn--block" type="button" id="save-shade">Save shade</button>
      <div class="btn-row">
        <a class="btn" id="try-link" href="tryon.html">Try on</a>
        <a class="btn" id="send-link" href="machine.html">Send to machine</a>
      </div>
    </section>
  </main>
  <nav class="tabbar" aria-label="Main">
    <a class="tab" href="index.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Home</a>
    <a class="tab" href="create.html" aria-current="page"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>Create</a>
    <a class="tab" href="ideas.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/><path d="M19 17v4M17 19h4"/></svg>Ideas</a>
    <a class="tab" href="collection.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>Saved</a>
    <a class="tab" href="machine.html"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v4M15 2v4M9 18v4M15 18v4M2 9h4M2 15h4M18 9h4M18 15h4"/></svg>Machine</a>
  </nav>
</div>
<script src="script.js" defer></script>
</body>
</html>
