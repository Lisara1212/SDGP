<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraBlend - Login & Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-6 text-slate-800 bg-[#faf7f7]">

  <div class="max-w-[1400px] w-full mx-auto space-y-5">
    
    <!-- HEADER BAR -->
    <header class="flex flex-wrap items-center justify-between gap-4 bg-white px-5 py-3.5 rounded-2xl border border-rose-100 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 via-pink-500 to-amber-400 p-0.5 flex items-center justify-center shadow-md shadow-rose-500/10">
          <div class="w-full h-full bg-white rounded-[10px] flex items-center justify-center">
            <i class="fa-solid fa-wand-magic-sparkles text-rose-500 text-lg"></i>
          </div>
        </div>
        <div>
          <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-rose-600 via-pink-600 to-amber-600 bg-clip-text text-transparent">AuraBlend</span>
          <p class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">AI IoT LIPSTICK FORMULATOR</p>
        </div>
      </div>
      <div class="flex items-center gap-2.5 bg-rose-50/60 px-4 py-1.5 rounded-full border border-rose-100 text-xs font-medium">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_#10b981]"></span>
        <span class="text-slate-600">IoT Device: <span class="text-emerald-600 font-semibold">Ready (Aura-x1)</span></span>
      </div>
    </header>

    <!-- NAVIGATION BAR -->
    <nav class="bg-white px-4 py-2.5 rounded-xl border border-rose-100 shadow-sm flex items-center justify-between overflow-x-auto">
      <div class="flex items-center gap-2">
        <a href="index.html" class="px-4 py-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50/50 text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-house"></i> Home</a>
        <a href="matchine.html" class="px-4 py-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50/50 text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-microchip text-amber-500"></i> Matchine</a>
        <a href="ideas.html" class="px-4 py-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50/50 text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-lightbulb text-amber-500"></i> Ideas</a>
        <a href="compare.html" class="px-4 py-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50/50 text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-code-compare text-rose-400"></i> Compare</a>
        <a href="saved.html" class="px-4 py-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50/50 text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-bookmark text-pink-500"></i> Saved</a>
        <a href="create.html" class="px-4 py-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50/50 text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-circle-plus text-emerald-500"></i> Create</a>
        <a href="tryon.html" class="px-4 py-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50/50 text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-face-smile text-rose-500"></i> Try On</a>
      </div>

      <!-- Account Button -->
      <div id="user-profile-badge" class="flex items-center gap-2">
        <a href="auth.html" id="auth-link" class="px-4 py-2 rounded-lg bg-rose-50 border border-rose-200 text-rose-600 text-xs font-bold flex items-center gap-2 transition">
          <i class="fa-solid fa-user"></i> <span id="nav-username">Account / Login</span>
        </a>
      </div>
    </nav>

    <!-- MAIN LOGIN / SIGN UP CONTAINER -->
    <main class="max-w-md mx-auto w-full bg-white rounded-2xl border border-rose-100 p-6 md:p-8 shadow-sm space-y-6 my-8">
      
      <!-- Tab Controls (Sign In vs Create Account) -->
      <div class="flex bg-rose-50/60 p-1 rounded-xl border border-rose-100 text-xs font-semibold">
        <button id="tab-login" onclick="switchAuthMode('login')" class="flex-1 py-2.5 rounded-lg bg-white text-rose-600 font-bold shadow-xs transition">
          Sign In
        </button>
        <button id="tab-signup" onclick="switchAuthMode('signup')" class="flex-1 py-2.5 rounded-lg text-slate-500 hover:text-slate-900 transition">
          Create Account
        </button>
      </div>

      <!-- Title & Subtitle -->
      <div class="text-center space-y-1">
        <h2 id="auth-title" class="text-xl font-bold text-slate-900 tracking-tight">Welcome Back to AuraBlend</h2>
        <p id="auth-subtitle" class="text-xs text-slate-500">Sign in to sync your custom lipstick formulas across devices.</p>
      </div>

      <!-- AUTH FORM -->
      <form id="auth-form" onsubmit="handleAuthSubmit(event)" class="space-y-4">
        
        <!-- Name Field (Only shown during Sign Up) -->
        <div id="field-name" class="space-y-1.5 hidden">
          <label class="text-xs font-bold text-slate-700">Full Name</label>
          <div class="relative">
            <i class="fa-solid fa-user absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
            <input type="text" id="input-name" placeholder="Sarah Jenkins" class="w-full bg-rose-50/30 border border-rose-100 rounded-xl py-2.5 pl-10 pr-4 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-rose-500 transition">
          </div>
        </div>

        <!-- AUTO-FILL QUICK TEST BUTTON -->
        <div class="bg-rose-50/50 border border-rose-100 p-3 rounded-xl flex items-center justify-between text-xs">
          <span class="text-slate-600">Want to test quickly?</span>
          <button type="button" onclick="autoFillDemoAccount()" class="bg-amber-100 hover:bg-amber-200 border border-amber-200 text-amber-800 font-bold px-3 py-1.5 rounded-lg transition flex items-center gap-1.5 shadow-xs">
            <i class="fa-solid fa-wand-magic-sparkles text-amber-600"></i> Auto-Fill Demo
          </button>
        </div>

        <!-- Email Field -->
        <div class="space-y-1.5">
          <label class="text-xs font-bold text-slate-700">Email Address</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
            <input type="email" id="input-email" required placeholder="name@aurablend.com" class="w-full bg-rose-50/30 border border-rose-100 rounded-xl py-2.5 pl-10 pr-4 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-rose-500 transition">
          </div>
        </div>

        <!-- Password Field -->
        <div class="space-y-1.5">
          <div class="flex justify-between items-center">
            <label class="text-xs font-bold text-slate-700">Password</label>
            <a href="#" id="link-forgot" class="text-[11px] text-rose-600 hover:underline">Forgot?</a>
          </div>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
            <input type="password" id="input-password" required placeholder="••••••••" class="w-full bg-rose-50/30 border border-rose-100 rounded-xl py-2.5 pl-10 pr-4 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-rose-500 transition">
          </div>
        </div>

        <!-- Action Button -->
        <button type="submit" id="btn-submit" class="w-full bg-gradient-to-r from-rose-500 to-pink-600 hover:brightness-105 text-white font-bold py-3 px-4 rounded-xl shadow-md shadow-rose-500/15 flex items-center justify-center gap-2 transition duration-200 text-xs">
          <span>Sign In to AuraBlend</span> <i class="fa-solid fa-arrow-right text-[10px]"></i>
        </button>
      </form>

      <!-- Divider -->
      <div class="relative flex items-center justify-center">
        <div class="border-t border-rose-100 w-full"></div>
        <span class="bg-white px-3 text-[10px] text-slate-400 font-bold uppercase">Or continue with</span>
        <div class="border-t border-rose-100 w-full"></div>
      </div>

      <!-- Quick Social Sign-In -->
      <div class="grid grid-cols-2 gap-3">
        <button onclick="socialAuth('Google')" class="bg-rose-50/40 hover:bg-rose-50 border border-rose-100 text-slate-700 text-xs font-semibold py-2.5 rounded-xl flex items-center justify-center gap-2 transition shadow-xs">
          <i class="fa-brands fa-google text-rose-500"></i> Google
        </button>
        <button onclick="socialAuth('Apple')" class="bg-rose-50/40 hover:bg-rose-50 border border-rose-100 text-slate-700 text-xs font-semibold py-2.5 rounded-xl flex items-center justify-center gap-2 transition shadow-xs">
          <i class="fa-brands fa-apple text-slate-900"></i> Apple ID
        </button>
      </div>

    </main>

  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    let currentMode = 'login';

    function switchAuthMode(mode) {
      currentMode = mode;
      const tabLogin = document.getElementById('tab-login');
      const tabSignup = document.getElementById('tab-signup');
      const fieldName = document.getElementById('field-name');
      const authTitle = document.getElementById('auth-title');
      const authSubtitle = document.getElementById('auth-subtitle');
      const btnSubmit = document.getElementById('btn-submit');
      const linkForgot = document.getElementById('link-forgot');

      if (mode === 'signup') {
        tabSignup.className = "flex-1 py-2.5 rounded-lg bg-white text-rose-600 font-bold shadow-xs transition";
        tabLogin.className = "flex-1 py-2.5 rounded-lg text-slate-500 hover:text-slate-900 transition";
        fieldName.classList.remove('hidden');
        authTitle.textContent = "Create Your AuraBlend Account";
        authSubtitle.textContent = "Formulate bespoke shades and sync with your Aura-x1 dispenser.";
        btnSubmit.innerHTML = `<span>Create Account</span> <i class="fa-solid fa-user-plus text-[10px]"></i>`;
        linkForgot.classList.add('hidden');
      } else {
        tabLogin.className = "flex-1 py-2.5 rounded-lg bg-white text-rose-600 font-bold shadow-xs transition";
        tabSignup.className = "flex-1 py-2.5 rounded-lg text-slate-500 hover:text-slate-900 transition";
        fieldName.classList.add('hidden');
        authTitle.textContent = "Welcome Back to AuraBlend";
        authSubtitle.textContent = "Sign in to sync your custom lipstick formulas across devices.";
        btnSubmit.innerHTML = `<span>Sign In to AuraBlend</span> <i class="fa-solid fa-arrow-right text-[10px]"></i>`;
        linkForgot.classList.remove('hidden');
      }
    }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const email = document.getElementById('input-email').value;
      const nameInput = document.getElementById('input-name');
      
      let userName = nameInput && nameInput.value ? nameInput.value : email.split('@')[0];
      userName = userName.charAt(0).toUpperCase() + userName.slice(1);

      localStorage.setItem('aurablend_user', userName);

      alert(`Welcome back, ${userName}! Redirecting to formulation studio...`);
      window.location.href = "create.html";
    }

    function socialAuth(provider) {
      const userName = `${provider} User`;
      localStorage.setItem('aurablend_user', userName);

      alert(`Connected via ${provider}! Welcome, ${userName}.`);
      window.location.href = "create.html";
    }

    function autoFillDemoAccount() {
      switchAuthMode('login');
      document.getElementById('input-email').value = "sarah.jenkins@aurablend.com";
      document.getElementById('input-password').value = "password123";

      const btn = document.getElementById('btn-submit');
      btn.classList.add('ring-2', 'ring-amber-400');
      setTimeout(() => btn.classList.remove('ring-2', 'ring-amber-400'), 1000);
    }
  </script>
</body>
</html>
