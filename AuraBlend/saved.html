<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraBlend - Saved Custom Shades</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-6 text-slate-800 bg-[#faf7f7]">

  <div class="max-w-[1400px] w-full mx-auto space-y-5">
    
    <!-- HEADER BAR -->
    <header class="flex flex-wrap items-center justify-between gap-4 bg-white px-5 py-3.5 rounded-2xl border border-rose-100 shadow-sm">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 via-pink-500 to-amber-400 p-0.5 flex items-center justify-center shadow-md shadow-rose-500/10">
          <div class="w-full h-full bg-white rounded-[10px] flex items-center justify-center">
            <i class="fa-solid fa-wand-magic-sparkles text-rose-500 text-lg"></i>
          </div>
        </div>
        <div>
          <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-rose-600 via-pink-600 to-amber-600 bg-clip-text text-transparent">AuraBlend</span>
          <p class="text-[10px] font-bold tracking-wider text-slate-400 uppercase">AI IoT LIPSTICK FORMULATOR</p>
        </div>
      </div>
      <div class="flex items-center gap-2.5 bg-rose-50/60 px-4 py-1.5 rounded-full border border-rose-100 text-xs font-medium">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse shadow-[0_0_8px_#10b981]"></span>
        <span class="text-slate-600">IoT Device: <span class="text-emerald-600 font-semibold">Ready (Aura-x1)</span></span>
      </div>
    </header>

    <!-- NAVIGATION BAR -->
    <nav class="bg-white px-4 py-2.5 rounded-xl border border-rose-100 shadow-sm flex items-center justify-between overflow-x-auto">
      <div class="flex items-center gap-2">
        <a href="index.html" class="px-4 py-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50/50 text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-house"></i> Home</a>
        <a href="matchine.html" class="px-4 py-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50/50 text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-microchip text-amber-500"></i> Matchine</a>
        <a href="ideas.html" class="px-4 py-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50/50 text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-lightbulb text-amber-500"></i> Ideas</a>
        <a href="compare.html" class="px-4 py-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50/50 text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-code-compare text-rose-400"></i> Compare</a>
        <a href="saved.html" class="px-4 py-2 rounded-lg bg-rose-50 border border-rose-200 text-rose-600 text-xs font-bold flex items-center gap-2 transition"><i class="fa-solid fa-bookmark text-pink-500"></i> Saved</a>
        <a href="create.html" class="px-4 py-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50/50 text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-circle-plus text-emerald-500"></i> Create</a>
        <a href="tryon.html" class="px-4 py-2 rounded-lg text-slate-600 hover:text-rose-600 hover:bg-rose-50/50 text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-face-smile text-rose-500"></i> Try On</a>
      </div>

      <!-- Account Button -->
      <div id="user-profile-badge" class="flex items-center gap-2">
        <a href="auth.html" id="auth-link" class="px-4 py-2 rounded-lg bg-rose-50 border border-rose-200 text-rose-600 text-xs font-bold flex items-center gap-2 transition">
          <i class="fa-solid fa-user"></i> <span id="nav-username">Sign In</span>
        </a>
      </div>
    </nav>

    <!-- SAVED SHADES SECTION -->
    <main class="bg-white rounded-2xl border border-rose-100 p-6 shadow-sm space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-4 border-b border-rose-100 pb-4">
        <div>
          <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
            <i class="fa-solid fa-bookmark text-rose-500"></i> Saved Custom Shades Collection
          </h2>
          <p class="text-xs text-slate-500">Manage, review, or re-dispense your favorite custom lipstick color formulas.</p>
        </div>
        <button onclick="clearSavedShades()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 border border-rose-200 text-xs font-bold px-4 py-2 rounded-xl transition">
          <i class="fa-solid fa-trash-can"></i> Clear Collection
        </button>
      </div>

      <!-- Collection Grid Container -->
      <div id="saved-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
        <div class="bg-rose-50/40 border border-rose-100 p-3 rounded-xl text-center space-y-2 shadow-xs">
          <div class="w-full h-14 rounded-lg bg-[#9B111E] shadow-xs"></div>
          <p class="text-xs font-bold text-slate-800 truncate">Royal Crimson</p>
          <p class="text-[10px] font-mono text-slate-500">#9B111E</p>
          <button onclick="dispenseSaved('#9B111E', 'Royal Crimson')" class="w-full bg-white hover:bg-rose-50 border border-rose-200 text-slate-700 text-[10px] font-bold py-1.5 rounded-lg transition shadow-xs">Dispense</button>
        </div>

        <div class="bg-rose-50/40 border border-rose-100 p-3 rounded-xl text-center space-y-2 shadow-xs">
          <div class="w-full h-14 rounded-lg bg-[#D85A7E] shadow-xs"></div>
          <p class="text-xs font-bold text-slate-800 truncate">Satin Rose</p>
          <p class="text-[10px] font-mono text-slate-500">#D85A7E</p>
          <button onclick="dispenseSaved('#D85A7E', 'Satin Rose')" class="w-full bg-white hover:bg-rose-50 border border-rose-200 text-slate-700 text-[10px] font-bold py-1.5 rounded-lg transition shadow-xs">Dispense</button>
        </div>
      </div>
    </main>

  </div>

  <!-- SCRIPT FOR SAVED PAGE -->
  <script>
    function clearSavedShades() {
      const grid = document.getElementById('saved-grid');
      grid.innerHTML = `<div class="col-span-full text-center py-10 text-xs text-slate-400 italic">No saved custom formulas found. Create shades in the Create page and click "Save Formula".</div>`;
    }

    function dispenseSaved(hex, name) {
      alert(`IoT Device Aura-x1: Re-dispensing saved shade "${name}" (${hex}) successfully!`);
    }
  </script>

  <!-- STEP 3 LOGIN SCRIPT -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const savedUser = localStorage.getItem('aurablend_user');
      const authLink = document.getElementById('auth-link');
      
      if (savedUser && authLink) {
        authLink.innerHTML = `<i class="fa-solid fa-user-check text-emerald-500"></i> Hello, <span class="text-slate-900 font-extrabold">${savedUser}</span>`;
        authLink.href = "#";
        authLink.className = "px-4 py-2 rounded-lg bg-rose-50 border border-rose-200 text-rose-600 text-xs font-bold flex items-center gap-2 transition";
        authLink.title = "Click to Log Out";
        
        authLink.onclick = function(e) {
          e.preventDefault();
          if (confirm("Do you want to log out of AuraBlend?")) {
            localStorage.removeItem('aurablend_user');
            window.location.reload();
          }
        };
      }
    });
  </script>

</body>
</html>
