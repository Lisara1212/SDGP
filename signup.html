<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#A3254A">
  <title>AuraBlend | Sign up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app app--no-nav">
  <header class="topbar"><div class="logo">AuraBlend</div></header>

  <main class="stack stack--lg">
    <section class="hero hero--compact" aria-labelledby="signup-title">
      <p class="eyebrow">Your shade. Your style.</p>
      <h1 id="signup-title">Make it yours</h1>
      <p>Create an account. Find your signature shade.</p>
      <div class="lipstick lipstick--sm" aria-hidden="true"><div class="lipstick__bullet"></div><div class="lipstick__collar"></div><div class="lipstick__tube"></div></div>
    </section>

    <form id="signup-form" class="stack" novalidate>
      <div class="field">
        <label class="field__label" for="name">Full name</label>
        <input class="input" id="name" name="name" type="text" autocomplete="name" placeholder="Your name">
      </div>
      <div class="field">
        <label class="field__label" for="email">Email address</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <label class="field__label" for="password">Password</label>
        <div class="input-wrap">
          <input class="input" id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" aria-describedby="pw-hint">
          <button class="input-wrap__btn" type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c5 0 8.5 4 9.5 6a14 14 0 0 1-3 3.8M6.6 6.7A14 14 0 0 0 2.5 12c1 2 4.5 6 9.5 6 1.4 0 2.7-.3 3.8-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
        </div>
        <p class="hint" id="pw-hint">Use at least 8 characters.</p>
      </div>
      <label class="check" for="terms">
        <input type="checkbox" id="terms" name="terms">
        <span>I agree to AuraBlend's <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</span>
      </label>
      <p class="form-error" role="alert" hidden></p>
      <button class="btn btn--primary btn--block" type="submit">Create account</button>
      <p class="small muted" style="text-align:center">Already have an account? <a class="link" href="login.html">Log in</a></p>
    </form>
  </main>
  <p class="tagline">Beauty, uniquely yours.</p>

</div>
<script src="script.js" defer></script>
</body>
</html>
