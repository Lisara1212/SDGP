<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#A3254A">
  <title>AuraBlend | Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app app--no-nav">
  <header class="topbar"><div class="logo">AuraBlend</div></header>

  <main class="stack stack--lg">
    <section class="hero hero--compact" aria-labelledby="login-title">
      <p class="eyebrow">Welcome back.</p>
      <h1 id="login-title">Sign back in</h1>
      <p>Your signature shade is waiting.</p>
      <div class="lipstick lipstick--sm" aria-hidden="true"><div class="lipstick__bullet"></div><div class="lipstick__collar"></div><div class="lipstick__tube"></div></div>
    </section>

    <form id="login-form" class="stack" novalidate>
      <div class="field">
        <label class="field__label" for="email">Email address</label>
        <input class="input" id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <div class="field">
        <div class="field__label"><label for="password">Password</label><a class="link" href="#">Forgot password?</a></div>
        <div class="input-wrap">
          <input class="input" id="password" name="password" type="password" autocomplete="current-password" placeholder="Your password">
          <button class="input-wrap__btn" type="button" data-toggle-password="password" aria-label="Show password" aria-pressed="false"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 6.2A9.8 9.8 0 0 1 12 6c5 0 8.5 4 9.5 6a14 14 0 0 1-3 3.8M6.6 6.7A14 14 0 0 0 2.5 12c1 2 4.5 6 9.5 6 1.4 0 2.7-.3 3.8-.8"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button>
        </div>
      </div>
      <p class="form-error" role="alert" hidden></p>
      <button class="btn btn--primary btn--block" type="submit">Log in</button>
      <div class="divider" role="separator"><span>or</span></div>
      <button class="btn btn--block" type="button" onclick="window.location.href='index.html'">Continue with Google</button>
      <p class="small muted" style="text-align:center">Don't have an account? <a class="link" href="signup.html">Sign up</a></p>
    </form>
  </main>
  <p class="tagline">Beauty, uniquely yours.</p>

</div>
<script src="script.js" defer></script>
</body>
</html>
