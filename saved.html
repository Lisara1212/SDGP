<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraBlend - Saved Custom Shades</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/png" href="AuraBlend Logo.jpg">
</head>
<body class="min-h-screen flex flex-col justify-between p-3 md:p-6 text-slate-200 bg-[#07090e]">

  <div class="max-w-[1400px] w-full mx-auto space-y-5">
    
    <!-- HEADER BAR -->
    <header class="flex flex-wrap items-center justify-between gap-4 bg-[#111625] px-5 py-3.5 rounded-2xl border border-slate-800/80 shadow-xl">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 via-pink-500 to-amber-400 p-0.5 flex items-center justify-center shadow-lg shadow-rose-500/20">
          <div class="w-full h-full bg-[#111625] rounded-[10px] flex items-center justify-center">
            <i class="fa-solid fa-wand-magic-sparkles text-amber-400 text-lg"></i>
          </div>
        </div>
        <div>
          <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white via-rose-100 to-pink-300 bg-clip-text text-transparent">AuraBlend</span>
          <p class="text-[10px] font-semibold tracking-wider text-slate-400 uppercase">AI IoT LIPSTICK FORMULATOR</p>
        </div>
      </div>
      <div class="flex items-center gap-2.5 bg-[#0b0e17] px-4 py-1.5 rounded-full border border-slate-800 text-xs font-medium">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse shadow-[0_0_8px_#34d399]"></span>
        <span class="text-slate-300">IoT Device: <span class="text-emerald-400 font-semibold">Ready (Aura-x1)</span></span>
      </div>
    </header>

    <!-- NAVIGATION BAR -->
    <nav class="bg-[#111625] px-4 py-2.5 rounded-xl border border-slate-800/80 shadow-md flex items-center justify-center sm:justify-start gap-2 overflow-x-auto">
      <a href="index.html" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-[#1a2338] text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-house"></i> Home</a>
      <a href="matchine.html" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-[#1a2338] text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-microchip text-amber-400"></i> Matchine</a>
      <a href="ideas.html" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-[#1a2338] text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-lightbulb text-yellow-400"></i> Ideas</a>
      <a href="saved.html" class="px-4 py-2 rounded-lg bg-rose-500/15 border border-rose-500/40 text-rose-300 text-xs font-bold flex items-center gap-2 transition"><i class="fa-solid fa-bookmark text-pink-400"></i> Saved</a>
      <a href="create.html" class="px-4 py-2 rounded-lg text-slate-400 hover:text-white hover:bg-[#1a2338] text-xs font-semibold flex items-center gap-2 transition"><i class="fa-solid fa-circle-plus text-emerald-400"></i> Create</a>
    </nav>

    <!-- SAVED SHADES SECTION -->
    <main class="bg-[#111625] rounded-2xl border border-slate-800/80 p-6 shadow-xl space-y-6">
      <div class="flex flex-wrap items-center justify-between gap-4 border-b border-slate-800 pb-4">
        <div>
          <h2 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-bookmark text-rose-500"></i> Saved Custom Shades Collection
          </h2>
          <p class="text-xs text-slate-400">Manage, review, or re-dispense your favorite custom lipstick color formulas.</p>
        </div>
        <button onclick="clearSavedShades()" class="bg-[#1a2338] hover:bg-rose-500/20 text-rose-400 border border-slate-700 text-xs font-bold px-4 py-2 rounded-xl transition">
          <i class="fa-solid fa-trash-can"></i> Clear Collection
        </button>
      </div>

      <!-- Collection Grid Container -->
      <div id="saved-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
        <!-- Sample/Default Placeholder Cards if empty -->
        <div class="bg-[#0b0e17] border border-slate-800 p-3 rounded-xl text-center space-y-2">
          <div class="w-full h-14 rounded-lg bg-[#9B111E] shadow-inner"></div>
          <p class="text-xs font-bold text-white truncate">Royal Crimson</p>
          <p class="text-[10px] font-mono text-slate-400">#9B111E</p>
          <button onclick="dispenseSaved('#9B111E', 'Royal Crimson')" class="w-full bg-[#1a2338] hover:bg-[#222d48] text-slate-200 text-[10px] font-bold py-1.5 rounded-lg transition">Dispense</button>
        </div>

        <div class="bg-[#0b0e17] border border-slate-800 p-3 rounded-xl text-center space-y-2">
          <div class="w-full h-14 rounded-lg bg-[#D85A7E] shadow-inner"></div>
          <p class="text-xs font-bold text-white">Satin Rose</p>
          <p class="text-[10px] font-mono text-slate-400">#D85A7E</p>
          <button onclick="dispenseSaved('#D85A7E', 'Satin Rose')" class="w-full bg-[#1a2338] hover:bg-[#222d48] text-slate-200 text-[10px] font-bold py-1.5 rounded-lg transition">Dispense</button>
        </div>
      </div>
    </main>

  </div>

  <!-- SCRIPT FOR SAVED PAGE -->
  <script>
    function clearSavedShades() {
      const grid = document.getElementById('saved-grid');
      grid.innerHTML = `<div class="col-span-full text-center py-10 text-xs text-slate-500 italic">No saved custom formulas found. Create shades in the Create page and click "Save Formula".</div>`;
    }

    function dispenseSaved(hex, name) {
      alert(`IoT Device Aura-x1: Re-dispensing saved shade "${name}" (${hex}) successfully!`);
    }
  </script>
</body>
</html>
